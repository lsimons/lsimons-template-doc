StylesPath = .vale/styles
MinAlertLevel = warning
Vocab = House

# Pinned releases, not `@latest`: an upstream change must never arrive by
# auto-download. Fetched by `mise run prose-sync`; the result is gitignored.
Packages = https://github.com/errata-ai/write-good/releases/download/v0.4.1/write-good.zip, \
  https://github.com/vale-cli/proselint/releases/download/v0.3.4/proselint.zip, \
  https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip, \
  https://github.com/tbhb/vale-ai-tells/releases/download/v1.37.0/ai-tells.zip

# Vale has no "only new content" mode; MinAlertLevel is the whole gate and
# `mise run prose` decides what fails (errors) and what only prints
# (warnings). Rules are named one by one rather than enabling a whole
# package: each package ships nearly everything at `error`, and which rule
# runs where is a decision recorded in docs/prose/README.md.
[*.{md,mdx}]
BasedOnStyles = Vale, House
# Spelling belongs to cspell (`mise run spell`, American English), so Vale's
# built-in check is off. Vale.Terms stays: it enforces the casing of the
# names in the accept list.
Vale.Spelling = NO

# write-good. A doubled word ("the the") is a typo every time, so it gates.
# The rest is worth reading but is a judgement call for a reviewer.
write-good.Illusions = error
write-good.Cliches = warning
write-good.Weasel = warning
write-good.ThereIs = warning
write-good.TooWordy = warning
# Off: Passive and So (too much idiom for every run), E-Prime.

# proselint. A hit is a defect every time: annotations left in text, slurs,
# "!!", "PIN number", oxymorons, non-words, "12 a.m.".
proselint.Annotations = error
proselint.Cursing = error
proselint.LGBTOffensive = error
proselint.Hyperbole = error
proselint.RASSyndrome = error
proselint.Oxymorons = error
proselint.Malapropisms = error
proselint.Nonwords = error
proselint.DateCase = error
proselint.DateMidnight = error
proselint.DateRedundancy = error
proselint.DateSpacing = error
# A hit deserves a look but may be deliberate.
proselint.GenderBias = warning
proselint.LGBTTerms = warning
proselint.DenizenLabels = warning
proselint.GroupTerms = warning
proselint.CorporateSpeak = warning
proselint.Airlinese = warning
proselint.Jargon = warning
proselint.Archaisms = warning
proselint.Skunked = warning
proselint.Hedging = warning
proselint.Apologizing = warning
proselint.Currency = warning
# Off: Typography (quoted UI strings mirror the screen), Cliches and Very
# (write-good covers them), Spelling (a British-to-American swap list, not
# a spell check), Diacritical, P-Value, AnimalLabels, Needless, But, and
# Uncomparables, which crashes Vale 3.20.0 when a match spans a line break.

# Google. A hit is a defect every time: "3pm", slash dates, a spaced dash,
# "he/she", "A.B.C.", a period ending a heading, "tl;dr".
Google.AMPM = error
Google.DateFormat = error
Google.EmDash = error
Google.Gender = error
Google.Periods = error
Google.HeadingPunctuation = error
Google.Slang = error
# Adopted house style, advisory: present tense over "will"; the Oxford comma; sentence-case headings (names that may stay capitalized
# go in accept.txt, which this rule honors); "for example" over "e.g.";
# no "currently" or "latest" (they rot); no "!"; no "(s)".
Google.Will = warning
Google.OxfordComma = warning
Google.Headings = warning
Google.Latin = warning
Google.Timeless = warning
Google.Exclamation = warning
Google.OptionalPlurals = warning
# Off: Quotes (the American convention; House.Quotes is the project's),
# Contractions (noise on every run), Passive, Parens, Colons, WordList, WordListCase, Ellipses,
# Anthropomorphism, Spacing, LyHyphens, GenderBias and Jargon (proselint's
# run already), Spelling (cspell's job), We, FirstPerson, Semicolons,
# ExcessiveClaims, Units, Ordinal, Ranges, Acronyms.

# ai-tells (tbhb/vale-ai-tells). The package ships 137 rules at `error`;
# only the ones nobody types by accident run here: an unspaced dash, "--"
# in prose, "I hope this helps", "In today's fast-paced", "In conclusion",
# "Let's unpack", "despite these challenges", "The result? ...", "rich
# tapestry", "cannot be overstated", and the listicle headings. The
# register rules (figurative verbs, tricolons, contrastive negation) are
# left out: they were tuned against one corpus and read as noise on a new
# site. Add them one at a time, as warnings, once there is prose to tune
# against.
ai-tells.EmDashUsage = error
ai-tells.DoubleHyphen = error
ai-tells.ClosingPleasantries = error
ai-tells.OpeningCliches = error
ai-tells.ConclusionMarkers = error
ai-tells.UnpackExplore = error
ai-tells.DespiteChallenges = error
ai-tells.RhetoricalSelfAnswer = error
ai-tells.AICompoundPhrases = error
ai-tells.PromotionalPuffery = error
ai-tells.UrgencyInflation = error
ai-tells.WrapUpHeadings = error
ai-tells.MarketingHeadings = error
ai-tells.AnnouncementHeadings = error
ai-tells.ListIntroductions = error
