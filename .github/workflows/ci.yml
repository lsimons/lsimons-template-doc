name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint, check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('docs/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('prek.toml') }}
          restore-keys: ${{ runner.os }}-prek-

      # These are the same steps, in the same order, as `mise run ci`. They
      # are spelled out rather than run as one `mise run ci` so a failure
      # names itself in the job summary. Keep the two lists in sync.
      - name: Install
        run: mise run docs-install

      - name: Lint
        run: mise run lint

      - name: Check (Astro type/content check)
        run: mise run docs-check

      - name: Build
        run: mise run docs-build

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          # The action's own defaults are version "latest" and collect
          # "default". Pin the version so a zizmor release cannot turn CI
          # red on its own, and name the collection kinds so
          # .github/dependabot.yml is audited too (`default` skips it, and
          # `all` would additionally stop honouring .gitignore). Both must
          # match `mise run audit` for that task to be a real local
          # mirror — bump them together.
          version: "1.29.0"
          collect: workflows,actions,dependabot
