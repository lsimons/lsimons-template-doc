name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Supersede in-flight runs for the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint, check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # `mise run lint` includes the gitleaks hook, which scans git
          # history. At the default fetch-depth of 1 it would see a single
          # commit, so CI would run a far weaker check than a developer
          # does locally while the README advertises them as the same one.
          fetch-depth: 0

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Pin mise itself, not only what it installs: the mise.lock
          # checksums and minimum_release_age are enforced by this binary,
          # so an unpinned "latest" here would undo them. The action hashes
          # the extracted linux-x64 binary (`mise/bin/mise` inside the
          # release tarball), not the tarball. Must match `min_version` in
          # .mise.toml; bump the three together.
          version: 2026.10.18
          sha256: e97c38973336aa2ff350fea50f47b412b266fe263b102b7200ff1e9b118c6942
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('site/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Cache prek hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/prek
          key: ${{ runner.os }}-prek-${{ hashFiles('prek.toml') }}
          restore-keys: ${{ runner.os }}-prek-

      # These are the same steps, in the same order, as `mise run ci`. They
      # are spelled out rather than run as one `mise run ci` so a failure
      # names itself in the job summary. Keep the two lists in sync.
      - name: Install
        run: mise run site-install-frozen

      - name: Lint
        run: mise run lint

      - name: Spell check
        run: mise run spell

      # The synced Vale styles are gitignored; fetch them before linting.
      - name: Fetch Vale styles
        run: mise run prose-sync

      - name: Prose lint
        run: mise run prose

      - name: Check (Astro type/content check)
        run: mise run site-check

      - name: Build
        run: mise run site-build

  site-audit:
    name: Site dependency audit (bun audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          # Pinned like the `build` job; see the comment there. Must match
          # `min_version` in .mise.toml; bump the three together.
          version: 2026.10.18
          sha256: e97c38973336aa2ff350fea50f47b412b266fe263b102b7200ff1e9b118c6942
          # `bun audit` needs only bun (mise adds --locked itself).
          install_args: bun
          install: true
          cache: true

      - name: Cache bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('site/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # The frozen task, as in `build`: the audit must see exactly the tree
      # bun.lock pins, not one re-resolved on the runner.
      - name: Install
        run: mise run site-install-frozen

      # Its own job rather than a step in `build`: it calls the registry's
      # advisory API, and a newly published advisory against an unchanged
      # tree should go red here without implying the build broke. It is
      # also not in `mise run ci`, for the same network reason as `links`.
      - name: Audit site dependencies (bun audit)
        run: mise run site-audit

  zizmor:
    name: Zizmor (GitHub Actions audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit GitHub Actions workflows (zizmor)
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          advanced-security: false
          # Pin the version: the action's default is "latest", so a zizmor
          # release could turn CI red on its own. Keep in step with
          # `zizmor` in .mise.toml, which is what `mise run audit` uses.
          version: "1.31.1"
          # `collect` is deliberately unset. The action's default already
          # covers workflows, composite actions, .github/dependabot.yml and
          # .pre-commit-config.yaml, while honouring .gitignore. Do not set
          # `collect: all` — that means "and stop honouring .gitignore",
          # which sweeps in every vendored workflow under site/node_modules
          # and reports dozens of findings about other people's repos.
